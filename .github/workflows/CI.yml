name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test fdtd-core
        run: cargo test -p fdtd-core

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install
      - run: pnpm --filter @fdtd-online/protocol run build
      - run: pnpm --filter @fdtd-online/native run build
      - run: pnpm --filter @fdtd-online/native run test
      - run: pnpm --filter @fdtd-online/server run typecheck
      - run: pnpm --filter @fdtd-online/web run typecheck
